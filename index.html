<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Заявки на бронирование</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__inner">
        <div class="brand">
          <div class="brand__title">Студия подкастов</div>
          <div class="brand__subtitle">Заявки на бронирование</div>
        </div>

        <nav class="tabs" aria-label="Навигация">
          <button id="tabNew" class="tab is-active" type="button">Новая заявка</button>
          <button id="tabList" class="tab" type="button">Заявки</button>
        </nav>
      </div>
    </header>

    <main class="container">
      <div id="statusBanner" class="banner" hidden></div>

      <!-- Экран: форма -->
      <section id="screenForm">
        <div class="card card--header">
          <h1 id="formTitle">Новая заявка</h1>
          <p class="muted" id="formHint">Заполните форму, чтобы отправить заявку на бронирование.</p>
        </div>

        <form id="bookingForm" class="card">
          <div class="field">
            <label>Имя *</label>
            <input name="name" autocomplete="name" />
            <div class="error" data-error-for="name"></div>
          </div>

          <div class="field">
            <label>Email *</label>
            <input name="email" type="email" autocomplete="email" />
            <div class="error" data-error-for="email"></div>
          </div>

          <div class="field">
            <label>Дата *</label>
            <div class="dateRow">
              <input id="dateInput" name="date" type="text" inputmode="numeric" placeholder="ГГГГ-ММ-ДД" autocomplete="off" />
              <button id="datePickerBtn" class="btn btn--ghost" type="button" aria-label="Открыть календарь">Календарь</button>
            </div>
            <div id="datePicker" class="datepicker" hidden></div>
            <div class="error" data-error-for="date"></div>
          </div>

          <div class="field">
            <label>Длительность *</label>
            <select name="duration_minutes">
              <option value="">Выберите…</option>
              <option value="30">30 минут</option>
              <option value="60">60 минут</option>
              <option value="90">90 минут</option>
            </select>
            <div class="error" data-error-for="duration_minutes"></div>
          </div>

          <div class="field">
            <label>Формат *</label>
            <select name="format">
              <option value="">Выберите…</option>
              <option value="audio">Аудио</option>
              <option value="video">Видео</option>
            </select>
            <div class="error" data-error-for="format"></div>
          </div>

          <div class="field">
            <label>Комментарий</label>
            <textarea name="comment" rows="4" placeholder="Что нам важно знать заранее?"></textarea>
            <div class="error" data-error-for="comment"></div>
          </div>

          <div class="fieldset">
            <label class="checkbox">
              <input name="consent" type="checkbox" />
              <span>Согласен(на) на отправку заявки *</span>
            </label>
            <div class="error" data-error-for="consent"></div>
          </div>

          <div class="actions">
            <button id="submitBtn" class="btn btn--primary" type="submit">Отправить</button>
            <button id="fillExampleBtn" class="btn" type="button">Заполнить примером</button>
            <button id="cancelEditBtn" class="btn btn--ghost" type="button" hidden>Отменить редактирование</button>
          </div>
        </form>

        <section id="successState" class="card" hidden>
          <h2>Готово</h2>
          <p>Спасибо — заявка отправлена.</p>
          <button id="resetBtn" class="btn" type="button">Отправить ещё одну</button>
        </section>
      </section>

      <!-- Экран: список -->
      <section id="screenList" hidden>
        <div class="card card--header">
          <h1>Все заявки</h1>
          <div class="headerRow">
            <p class="muted">Кликните по карточке, чтобы отредактировать.</p>
            <button id="refreshListBtn" class="btn" type="button">Обновить</button>
          </div>
        </div>

        <div id="bookingsList" class="cards"></div>
        <div id="emptyList" class="card" hidden>
          <p>Пока нет заявок. Создайте первую во вкладке «Новая заявка».</p>
        </div>
      </section>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
